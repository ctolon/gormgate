# The full default check set, with nothing disabled.
#
# ST1005 (error string style) is deliberately left on: gormgate's error
# strings are Go error strings, lower case and without a trailing period,
# even where the wording comes from Django. Text a command *writes* to the
# user is display text, not an error string, and keeps Django's wording
# exactly. See docs/adaptations.md, "Error text is a Go error string".
checks = ["all"]
